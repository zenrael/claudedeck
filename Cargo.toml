[package]
name = "claudedeck"
version = "0.4.0"
edition = "2021"
description = "OpenDeck plugin to launch and focus Claude Code terminal sessions"

[dependencies]
openaction = "2.6"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
simplelog = "0.12"
resvg = "0.44"
base64 = "0.22"
dashmap = "6"

[profile.release]
strip = true
